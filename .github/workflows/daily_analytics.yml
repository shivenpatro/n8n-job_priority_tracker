name: Daily Job Market Analytics Pipeline

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: job-market-analytics
  cancel-in-progress: false

jobs:
  run-pipeline:
    name: Execute Headless n8n & Publish Market Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Project Dependencies
        run: |
          npm ci
          npx puppeteer browsers install chrome || true

      - name: Install n8n CLI Globally
        run: |
          npm install -g n8n

      - name: Execute Headless n8n Workflow
        env:
          N8N_DIAGNOSTICS_ENABLED: "false"
          N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
          N8N_TEMPLATES_ENABLED: "false"
          N8N_HIRING_BANNER_ENABLED: "false"
          N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "false"
        run: |
          npx n8n execute --file workflows/job_monitor_pipeline.json

      - name: Generate Executive PDF Report
        run: |
          node scripts/generate_pdf.js

      - name: Upload Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: latest_market_report
          path: reports/latest_market_report.pdf
          retention-days: 30
          if-no-files-found: error

      - name: Commit & Push Updated Analytics
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(data): daily market analytics snapshot [skip ci]"
          file_pattern: "data/trend_metrics.json data/latest_jobs.json README.md reports/latest_market_report.pdf"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
